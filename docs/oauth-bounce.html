<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Latchkey OAuth bounce</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        max-width: 38rem;
        margin: 3rem auto;
        padding: 0 1rem;
      }
      h1 { font-size: 1.25rem; }
      .ok { color: #1a7f37; }
      .err { color: #cf222e; }
      code { background: rgba(127,127,127,.18); padding: .1em .3em; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Latchkey OAuth bounce</h1>
    <p id="status">Forwarding the authorization result to latchkey…</p>
    <p id="detail" hidden></p>

    <!--
      This is the latchkey OAuth "bounce" page. Host it at a stable https URL
      (e.g. https://imbue.github.io/oauth-bounce/) and register it as the
      redirect URI of an OAuth client, then tell latchkey to use it:

        latchkey auth prepare dropbox '{"redirectUri":"https://imbue.github.io/oauth-bounce/"}'

      Latchkey runs a loopback callback server on a random port per login. It
      cannot be known in advance, so latchkey puts the port in the OAuth `state`
      parameter as `<random>.<port>` (see `buildAuthorizationState` in
      src/oauthUtils.ts). The authorization server echoes `state` back here
      unchanged, so this page forwards the query string to the loopback
      callback at http://localhost:<port>/oauth2callback. Both Dropbox and the
      remote-MCP services (Notion, …) use this same contract.
    -->

    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        const status = document.getElementById('status');
        const detail = document.getElementById('detail');

        const port = (params.get('state') || '').split('.').pop();
        const code = params.get('code');

        if (!port || !/^\d+$/.test(port)) {
          status.className = 'err';
          status.textContent =
            'No loopback port found in state — did the request come from latchkey?';
          detail.hidden = false;
          detail.textContent = 'state=' + (params.get('state') || '(none)');
          return;
        }

        if (!code) {
          // RFC 6749 §4.1.2.1: a refused grant comes back with `error`.
          const error = params.get('error') || 'no_code';
          status.className = 'err';
          status.textContent = 'Authorization failed: ' + error +
            (params.get('error_description') ? ' — ' + params.get('error_description') : '');
          // Still forward so latchkey's callback server sees the error and
          // reports it instead of timing out.
        }

        const target =
          'http://localhost:' + port + '/oauth2callback?' + window.location.search.replace(/^\?/, '');

        // `navigate` first so the user sees the tab flip to localhost; fall
        // back to `fetch` (no-cors is fine: the server only needs to receive
        // the request) if navigation is blocked.
        try {
          window.location.replace(target);
          return;
        } catch (_) {
          /* fall through */
        }

        fetch(target, { mode: 'no-cors', redirect: 'manual' })
          .then(() => {
            status.className = 'ok';
            status.textContent = 'Authorization result delivered. You can close this tab.';
          })
          .catch((e) => {
            status.className = 'err';
            status.textContent = 'Could not reach latchkey on localhost:' + port + '.';
            detail.hidden = false;
            detail.textContent = String(e);
          });
      })();
    </script>
  </body>
</html>
